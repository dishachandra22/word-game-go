version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dailywordgame_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wordgame
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wordgame"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dailywordgame_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 10

  migration:
    image: postgres:16-alpine
    container_name: dailywordgame_migration
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wordgame?sslmode=disable
    command: >
      sh -c "
        echo 'Running database migrations in filename order...'
        for f in /migrations/*.sql; do
          echo 'Applying migration: '$$f
          psql -h postgres -U postgres -d wordgame -f \"$$f\"
        done
        echo 'Migrations applied successfully.'
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dailywordgame_app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wordgame?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
