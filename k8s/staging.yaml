---
apiVersion: v1
kind: Namespace
metadata:
  name: staging

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: staging
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS daily_words (
        id SERIAL PRIMARY KEY,
        game_date DATE UNIQUE NOT NULL,
        word VARCHAR(10) NOT NULL
    );

    CREATE TABLE IF NOT EXISTS players (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) UNIQUE NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS guesses (
        id SERIAL PRIMARY KEY,
        player_name VARCHAR(100) NOT NULL,
        game_date DATE NOT NULL,
        guess_word VARCHAR(10) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

  02-sample.sql: |
    INSERT INTO daily_words (game_date, word)
    VALUES (CURRENT_DATE, 'CRANE')
    ON CONFLICT (game_date) DO UPDATE SET word = 'CRANE';

    INSERT INTO players (name)
    VALUES ('asha'), ('bob')
    ON CONFLICT (name) DO NOTHING;

  03-advanced.sql: |
    ALTER TABLE players 
    ADD COLUMN IF NOT EXISTS password VARCHAR(255) DEFAULT 'password123',
    ADD COLUMN IF NOT EXISTS role VARCHAR(20) DEFAULT 'user',
    ADD COLUMN IF NOT EXISTS current_streak INT DEFAULT 0,
    ADD COLUMN IF NOT EXISTS max_streak INT DEFAULT 0,
    ADD COLUMN IF NOT EXISTS games_played INT DEFAULT 0,
    ADD COLUMN IF NOT EXISTS games_won INT DEFAULT 0;

    ALTER TABLE daily_words 
    ADD COLUMN IF NOT EXISTS hint_1 VARCHAR(255) DEFAULT 'First letter: C',
    ADD COLUMN IF NOT EXISTS hint_2 VARCHAR(255) DEFAULT 'Vowels: Contains A and E',
    ADD COLUMN IF NOT EXISTS hint_3 VARCHAR(255) DEFAULT 'Meaning: A tall wading bird or lifting machine';

    UPDATE daily_words 
    SET hint_1 = 'First letter: C (Begins with a consonant)',
        hint_2 = 'Vowels: Contains 2 vowels (A and E)',
        hint_3 = 'Clue: A tall wading bird or a construction machine'
    WHERE game_date = CURRENT_DATE;

    CREATE TABLE IF NOT EXISTS friends (
        id SERIAL PRIMARY KEY,
        player_name VARCHAR(100) NOT NULL,
        friend_name VARCHAR(100) NOT NULL,
        status VARCHAR(20) DEFAULT 'accepted',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT unique_friendship UNIQUE (player_name, friend_name)
    );

    INSERT INTO players (name, password, role, current_streak, max_streak, games_played, games_won)
    VALUES 
      ('admin', 'admin123', 'admin', 5, 12, 15, 14),
      ('alex', 'password123', 'user', 3, 5, 8, 7),
      ('dev', 'password123', 'user', 2, 4, 6, 5)
    ON CONFLICT (name) DO NOTHING;

    INSERT INTO friends (player_name, friend_name)
    VALUES 
      ('asha', 'alex'),
      ('asha', 'dev'),
      ('alex', 'asha')
    ON CONFLICT DO NOTHING;

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: staging
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "wordgame"
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d wordgame
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: staging
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: staging
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli ping | grep PONG
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: staging
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-word-game
  namespace: staging
  labels:
    app: daily-word-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daily-word-game
  template:
    metadata:
      labels:
        app: daily-word-game
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: daily-word-game
          image: disha220/word-game-go:stage
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/wordgame?sslmode=disable"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: daily-word-game
  namespace: staging
  labels:
    app: daily-word-game
spec:
  type: ClusterIP
  selector:
    app: daily-word-game
  ports:
    - name: http
      port: 8080
      targetPort: 8080
